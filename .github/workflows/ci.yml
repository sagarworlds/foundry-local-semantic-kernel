name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded runs for PRs; every push to main should get a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: LocalFoundry.Api/LocalFoundry.Api.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      # Warnings (including CS1591 missing XML docs) fail the build. NuGet vulnerability
      # advisories (NU1901-NU1904) stay warnings so a newly published advisory can't
      # break unrelated PRs; they're still visible in the log.
      - name: Build
        run: >
          dotnet build "$SOLUTION" --no-restore -c Release
          -p:TreatWarningsAsErrors=true
          "-p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"

      - name: Test
        run: dotnet test "$SOLUTION" --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build only (no push): proves the Dockerfile still works after project or package changes.
      - name: Build image
        run: docker build -t localfoundry-api:ci .

      # The app must start and serve requests without Foundry Local being present.
      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 localfoundry-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/info > /dev/null; then
              echo "API answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not answer within 30 seconds"
          docker logs api
          exit 1
