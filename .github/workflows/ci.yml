name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded runs for PRs; every push to main should get a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: LocalFoundry.Api/LocalFoundry.Api.slnx

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      # Warnings (including CS1591 missing XML docs) fail the build. NuGet vulnerability
      # advisories (NU1901-NU1904) stay warnings so a newly published advisory can't
      # break unrelated PRs; they're still visible in the log.
      - name: Build
        run: >
          dotnet build "$SOLUTION" --no-restore -c Release
          -p:TreatWarningsAsErrors=true
          "-p:WarningsNotAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904"

      - name: Test
        run: dotnet test "$SOLUTION" --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
